<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--soft:#f6f8fa;--accent:#0969da}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#f0f6fc;--muted:#9198a1;--line:#3d444d;--soft:#151b23;--accent:#4493f8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Noto Sans JP","Noto Sans KR",sans-serif}
main{max-width:960px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
h1{font-size:24px;margin:0}
.ttl{display:flex;align-items:center;gap:10px}
.gh{color:var(--fg);display:inline-flex}
.gh:hover{color:var(--accent)}
.ctl{display:flex;flex-wrap:wrap;gap:8px}
.sub{color:var(--muted);font-size:14px;margin:4px 0 16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--fg);padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tabs .n{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:0 7px;font-size:12px;font-weight:400}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
td:first-child{white-space:normal;min-width:180px}
th{background:var(--soft);font-weight:600}
tr:last-child td{border-bottom:0}
td.lv,th.lv{text-align:center}
td.lv span{display:inline-flex;align-items:center;gap:6px}
.note{color:var(--muted);font-size:14px;margin-top:12px}
img{vertical-align:middle}
</style>
</head>

function sync(){const p=new URLSearchParams();p.set("lang",lang);if(kind!=="game")p.set("kind",kind);if(tab!=="all")p.set("level",tab);history.replaceState(null,"","?"+p);render();}
render();
</script>
