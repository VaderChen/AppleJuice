<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 395" role="img" aria-labelledby="title description">
<title id="title">AppleJuice execution path</title>
<desc id="description">A Windows game passes through the PE loader to resident ARM64 translation and Windows services. Direct3D maps to Metal with optional MetalFX upscaling. The macOS audio branch supports HRTF headphone mixing alongside native input and file services.</desc>
<rect width="600" height="395" rx="14" fill="#19221e"/>
